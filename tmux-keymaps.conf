# List foreground process names separated by '|' (e.g., agy|fzf|peco|ranger)
target_apps="agy|opencode"

# Check if any target process is active in the current pane's TTY
is_target_app="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?($target_apps)$'"

# Map Emacs keys -> Arrow keys for listed apps; pass-through otherwise
bind-key -n C-p if-shell "$is_target_app" "send-keys Up"    "send-keys C-p"
bind-key -n C-n if-shell "$is_target_app" "send-keys Down"  "send-keys C-n"
bind-key -n C-b if-shell "$is_target_app" "send-keys Left"  "send-keys C-b"
bind-key -n C-f if-shell "$is_target_app" "send-keys Right" "send-keys C-f"

# Optional: Line start / line end
bind-key -n C-a if-shell "$is_target_app" "send-keys Home"  "send-keys C-a"
bind-key -n C-e if-shell "$is_target_app" "send-keys End"   "send-keys C-e"
